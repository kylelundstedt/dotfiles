"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 1000

[aws]
disabled = false

[azure]
format = 'on [$symbol($subscription)]($style) '
disabled = true

[character]
success_symbol = '[➜](bold green)'
error_symbol = '[✗](bold red) '

[cmd_duration]
min_time = 5000
format = 'underwent [$duration](bold yellow)'

[container]
disabled = true

[directory]
truncate_to_repo = true

[docker_context]
disabled = true

[gcloud]
disabled = true

[git_branch]
ignore_branches = ['master', 'main']

[git_status]
conflicted = '='
ahead = '⇡'
behind = '⇣'
diverged = '⇕'
up_to_date = ''
untracked = '?'
stashed = '*'
modified = '!'
staged = '[+$count](green)'
renamed = '»'
deleted = '✘'
disabled = false

[golang]
disabled = true

[hostname]
ssh_only = false
format = '[$hostname](bold dimmed green) '
disabled = false

[kubernetes]
disabled = true

[nix_shell]
disabled = false
impure_msg = 'devbox'
format = 'via [$symbol$state](bold purple) '

[package]
disabled = true

[sudo]
disabled = true

[username]
disabled = true
