[project]
name = "dotfiles-python"
version = "0.1.0"
description = "Per-project Python tool dependencies for dotfiles."
requires-python = ">=3.12"
dependencies = [
  "altair>=5.0.1",
  "dlt[duckdb,filesystem,motherduck,parquet,snowflake]>=1.5.0",
  "duckdb>=1.1.3",
  "marimo>=0.10.7",
  "polars>=1.0.0",
  "seaborn>=0.12.2",
  "sqlmesh[dlt,github,slack,snowflake]>=0.141.1",
]

[tool.uv]
managed = true
