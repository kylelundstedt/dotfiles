[project]
name = "archives-hub-mcp"
version = "0.1.0"
description = "MCP server for unified search across the local email/calendar/web archives"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "duckdb>=1.1.0",
    "sqlite-vec>=0.1.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
